# AIR Web Console — containerised for a quick launch with nothing to
# install. Local development and testing only: this does not join
# air-infra's `air-net` and does not require air-infra to be up — the
# console reaches whatever AIR services are already running (natively or in
# their own containers) through the ports they publish on the host.
#
# Run with `make up` (reads `.env.local` for build args and runtime secrets;
# see the Makefile) or directly:
#   docker compose --env-file .env.local up -d --build
name: air-web-console

services:
  air-web-console:
    build:
      context: .
      target: runtime
      args:
        # Build-time only, and not a secret in the same sense as an upstream
        # API key — see Dockerfile and src/lib/auth/gatewayAuth.ts. Falls
        # back to the same demo value .env.example ships so `make up` works
        # on a fresh checkout with zero edits.
        NEXT_PUBLIC_AIR_WEB_GATEWAY_TOKEN: ${NEXT_PUBLIC_AIR_WEB_GATEWAY_TOKEN:-air-web-console-dev-gateway-token}
    image: air-web-console:local
    ports:
      # Bound to loopback deliberately — this console is a tool on your
      # machine, not a service for the network to reach.
      - "127.0.0.1:${AIR_WEB_PORT:-3000}:3000"

    # `host.docker.internal` is the machine running Docker. Docker Desktop
    # provides it; this mapping is what makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # Inside a container, 127.0.0.1 is the container. The `local` target
      # is therefore re-pointed at the Docker host, so "local" keeps meaning
      # "the services on my laptop" rather than silently meaning nothing —
      # verified end-to-end against air-classifier on :8082. `environment:`
      # wins over `env_file:` below, so these three stay pointed at the host
      # whatever the file says.
      AIR_WEB__TARGET: local
      AIR_WEB__TARGETS__LOCAL__LABEL: Local — services on the Docker host
      AIR_WEB__TARGETS__LOCAL__CLASSIFIER_BASE_URL: http://host.docker.internal:8082
      AIR_WEB__TARGETS__LOCAL__PLATFORM_BASE_URL: http://host.docker.internal:8081
      AIR_WEB__TARGETS__LOCAL__LLM_BASE_URL: http://host.docker.internal:8083

    # Real keys, the gateway token, and any remote targets come from an
    # untracked .env.local, never baked into the image (see .dockerignore).
    env_file:
      - path: .env.local
        required: false

    restart: unless-stopped
